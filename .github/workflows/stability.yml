name: 30-minute browser stability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stability.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes playwright@1.58.2 install --with-deps --only-shell chromium
      - run: |
          chromium_path=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -print -quit)
          test -x "$chromium_path"
          CHROMIUM="$chromium_path" npm run test:browser
        env:
          KINGDOM_REALTIME_MINUTES: '30'
