<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152624">
  <title>世界樹の年代記 — Kingdom Observer</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <header>
    <h1>世界樹の年代記 <span>Kingdom Observer</span></h1>
    <div class="readouts">
      <output id="clock"></output>
      <output id="population"></output>
      <output id="food"></output>
      <output id="nations"></output>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <div class="group" id="speeds" role="group" aria-label="進行速度">
        <button type="button" data-speed="0">停止</button>
        <button type="button" data-speed="1">1×</button>
        <button type="button" data-speed="5">5×</button>
        <button type="button" data-speed="20">20×</button>
      </div>
      <form id="new-world" class="group">
        <label for="seed">シード</label>
        <input type="text" id="seed" value="world-tree" maxlength="80" required>
        <label class="camera-option"><input type="checkbox" id="mixed-families"> 異種族の家族を許可</label>
        <label class="camera-option"><input type="checkbox" id="allied-intervention"> 防衛協定による参戦を許可</label>
        <button type="submit">新しい世界</button>
      </form>
      <div class="group">
        <button type="button" id="save">保存</button>
        <button type="button" id="open">読込</button>
        <input type="file" id="file" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="game-layout">
    <div class="viewport">
      <canvas id="map" aria-label="世界地図。ドラッグで移動、ホイールまたはピンチで拡大縮小"></canvas>
      <canvas id="overview" tabindex="0" aria-label="全体地図。クリックまたは矢印キーで地図を移動" hidden></canvas>
      <div class="zoom group" role="group" aria-label="カメラ">
        <button type="button" id="zoom-out" aria-label="縮小">−</button>
        <button type="button" id="center" aria-label="集落に戻る">集落</button>
        <button type="button" id="overview-toggle" aria-controls="overview" aria-pressed="false">全体地図</button>
        <button type="button" id="zoom-in" aria-label="拡大">＋</button>
      </div>
    </div>
    <aside id="observation" aria-label="歴史と観察">
      <div class="group">
        <select id="history-tab" aria-label="観察の種類">
          <option value="world">世界史</option><option value="citizen">人物伝</option>
          <option value="family">家系図</option><option value="settlement">集落</option><option value="nation">国家史</option><option value="ecology">魔物分布</option>
        </select>
        <input id="history-search" type="search" aria-label="観察対象を検索" placeholder="名前・種族・ID" hidden>
        <select id="history-subject" aria-label="観察対象" hidden></select>
        <button type="button" id="follow" hidden>追跡</button>
      </div>
      <label class="camera-option" id="favorite-filter" hidden><input type="checkbox" id="favorite-only"> 注目人物だけ</label>
      <label class="camera-option"><input type="checkbox" id="auto-camera"> 事件を自動追跡</label>
      <label class="camera-option"><input type="checkbox" id="auto-resume"> 手動操作後に自動追跡へ戻る</label>
      <select id="event-filter" aria-label="世界史の出来事を絞り込む">
        <option value="all">すべての出来事</option><option value="nations">国家・戦争</option>
        <option value="people">住民・集落</option><option value="adventure">冒険・魔物</option>
        <option value="science">研究・文明</option><option value="god">神の介入</option>
      </select>
      <div id="history-body"></div>
      <details>
        <summary>神の介入</summary>
        <form id="god-form">
          <label>操作 <select id="god-kind">
            <option value="life">生命創造</option><option value="resource">資源生成</option>
            <option value="terrain">地形編集</option><option value="monster">魔物召喚</option>
            <option value="blessing">祝福</option><option value="disaster">災害</option>
          </select></label>
          <label>種類 <select id="god-value"></select></label>
          <label id="god-amount">数量 <input type="number" id="god-quantity" min="1" max="10" value="1" required></label>
          <div class="group">
            <label>X <input type="number" id="god-x" min="0" max="63" value="32" required></label>
            <label>Y <input type="number" id="god-y" min="0" max="63" value="32" required></label>
          </div>
          <button type="submit">確定</button>
          <output id="god-status" aria-live="polite"></output>
        </form>
      </details>
    </aside>
    </div>
    <footer>
      <span>ドラッグで移動 · ホイール／ピンチで拡大縮小 · Spaceで停止／再開</span>
      <span role="status" id="status"></span>
    </footer>
  </main>
</body>
</html>
